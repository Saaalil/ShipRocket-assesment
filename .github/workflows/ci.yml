name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers onnxruntime pyyaml scikit-learn soundfile numpy
      - name: Test
        run: python -m pytest tests/test_audio.py tests/test_model.py tests/test_inference.py -q
      - name: Lint
        run: python -m ruff check src tests scripts demo
