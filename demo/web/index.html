<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shiprocket Turn Detection</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Turn Detection</h1>
      <p class="lede">
        Client-side ONNX demo. A pause is a VAD event; completeness is the model decision.
      </p>
      <section>
        <label>Threshold <input id="threshold" type="range" min="0.05" max="0.95" step="0.05" value="0.5" /></label>
        <span id="threshold-value">0.50</span>
      </section>
      <section class="row">
        <button id="record">Record</button>
        <button id="stop" disabled>Stop</button>
        <input id="file" type="file" accept="audio/*" />
      </section>
      <p id="status">Load the model, then record or upload a clip.</p>
      <pre id="result"></pre>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
