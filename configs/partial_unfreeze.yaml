name: partial_unfreeze
data: configs/data.yaml
base_model: openai/whisper-tiny
freeze_encoder: true
unfreeze_encoder_layers: 2
learning_rate: 5.0e-5
encoder_learning_rate: 8.0e-6
num_epochs: 1
train_batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 16
warmup_ratio: 0.08
weight_decay: 0.01
max_grad_norm: 1.0
fp16: true
eval_strategy: "no"
eval_steps: 9999
save_steps: 100
save_total_limit: 4
logging_steps: 20
threshold: 0.5
auxiliary_filler_loss: false
upsample_indic: true
output_dir: /content/drive/MyDrive/smart_turn_runs/partial_unfreeze
resume_from: auto
max_train_samples: 100000
write_batch_size: 128
subset_cache: /content/drive/MyDrive/smart_turn_en_hi_100k
