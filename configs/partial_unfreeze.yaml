name: partial_unfreeze
data: configs/data.yaml
base_model: openai/whisper-tiny
freeze_encoder: true
unfreeze_encoder_layers: 2
learning_rate: 5.0e-5
encoder_learning_rate: 8.0e-6
num_epochs: 2
train_batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 16
warmup_ratio: 0.08
weight_decay: 0.01
max_grad_norm: 1.0
fp16: true
eval_steps: 400
save_steps: 400
logging_steps: 50
threshold: 0.5
auxiliary_filler_loss: false
output_dir: artifacts/partial_unfreeze
resume_from: null
max_train_samples: null
