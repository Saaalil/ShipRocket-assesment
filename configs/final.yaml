name: final
data: configs/data.yaml
base_model: openai/whisper-tiny
freeze_encoder: true
unfreeze_encoder_layers: 2
learning_rate: 3.0e-5
encoder_learning_rate: 5.0e-6
num_epochs: 1
train_batch_size: 8
eval_batch_size: 16
gradient_accumulation_steps: 16
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
fp16: true
eval_steps: 300
save_steps: 300
logging_steps: 50
threshold: 0.5
upsample_indic: true
indic_sample_weight: 2.0
auxiliary_filler_loss: false
output_dir: artifacts/final
resume_from: artifacts/partial_unfreeze
onnx_fp32_path: artifacts/model_fp32.onnx
onnx_int8_path: artifacts/model_int8.onnx
calibration_samples: 256
