name: head_only
data: configs/data.yaml
base_model: openai/whisper-tiny
freeze_encoder: true
unfreeze_encoder_layers: 0
learning_rate: 1.0e-4
encoder_learning_rate: 0.0
num_epochs: 1
train_batch_size: 8
eval_batch_size: 8
gradient_accumulation_steps: 16
warmup_ratio: 0.08
weight_decay: 0.01
max_grad_norm: 1.0
fp16: true
eval_steps: 200
save_steps: 200
logging_steps: 20
threshold: 0.5
auxiliary_filler_loss: false
upsample_indic: true
output_dir: /content/drive/MyDrive/smart_turn_runs/head_only
resume_from: null
max_train_samples: 100000
write_batch_size: 128
subset_cache: /content/drive/MyDrive/smart_turn_en_hi_100k
