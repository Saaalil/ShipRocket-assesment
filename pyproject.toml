[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-turn"
version = "0.1.0"
description = "Tiny audio-native turn detection for the Shiprocket assignment."
readme = "projectspec.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Saalil" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "soundfile>=0.12",
  "librosa>=0.10",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.44",
  "datasets>=2.20",
  "accelerate>=0.33",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
demo = [
  "gradio>=4.44",
  "onnxruntime>=1.18",
  "transformers>=4.44",
  "torch>=2.2",
]
dev = [
  "ruff>=0.6",
]

[project.scripts]
smart-turn-predict = "smart_turn.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
